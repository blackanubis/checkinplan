# checkinplan：单容器（静态页面 + 数据同步 API）
# 页面和接口都在同一个容器里，对外端口 13003；数据落在 /data（SQLite）
services:
  checkinplan:
    image: ghcr.io/blackanubis/checkinplan:latest
    container_name: checkinplan
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-13003}:80"
    volumes:
      # 数据库所在目录，改这一行就能换持久化位置
      - "${DATA_DIR:-./data}:/data"
    environment:
      - TZ=Asia/Shanghai
