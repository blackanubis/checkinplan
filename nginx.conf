server {
    listen       80;
    server_name  _;

    # 中文文件名与中文内容都需要显式声明编码
    charset utf-8;
    default_type text/html;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 练习页面每次都要拿最新版，禁止缓存，避免改了页面不生效
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
